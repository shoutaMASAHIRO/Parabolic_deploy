version: '3.8'

services:
  # Backend Node.js server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    container_name: parabolic_server
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/parabolic
    depends_on:
      - db

  # PostgreSQL Database
  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=parabolic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Optional: for external access/debugging
    restart: unless-stopped
    container_name: parabolic_db

  # Frontend Nginx server
  frontend:
    image: nginx:1.21-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./index.html:/usr/share/nginx/html/index.html
      - ./style.css:/usr/share/nginx/html/style.css
      - ./dist:/usr/share/nginx/html/dist
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
    container_name: parabolic_frontend

volumes:
  postgres_data:
