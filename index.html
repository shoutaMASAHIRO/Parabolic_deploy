<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toggle-container">
        <button id="stockToggle" class="active">株価</button>
        <button id="usdJpyToggle">ドル円</button>

        <div class="email-list-container">
            <button id="toggle-email-list-button">登録済みメール</button>
            <button id="send-email-button">メール送信</button>
            <div id="email-list-panel" class="hidden">
                <ul id="email-list">
                    <!-- Emails will be populated here -->
                </ul>
            </div>
        </div>
    </div>
    <header>
        
        <div id="controls">
            <div class="input-group">
                <label for="tickers-input">銘柄コード (例: 9166,7203)</label>
                <input type="text" id="tickers-input" value="7203">
            </div>
            <div class="input-group">
                <label for="interval-select">データ取得間隔</label>
                <select id="interval-select">
                    <option value="1m">1分</option>
                    <option value="5m">5分</option>
                    <option value="15m">15分</option>
                    <option value="30m">30分</option>
                    <option value="1h">1時間</option>
                    <option value="1d" selected>日足</option>
                </select>
            </div>
            <button id="start-button">表示開始</button>
            <div id="status-message"></div>
        </div>
    </header>

    <div class="main-container">
        <main id="charts-container">
            <!-- Charts will be dynamically inserted here -->
        </main>
        
        <div class="sidebar-controls">
            <div id="indicator-settings" class="hidden">
                <div class="input-group">
                    <label for="bb-period">BB期間</label>
                    <input type="number" id="bb-period" value="20">
                </div>
                <div class="input-group">
                    <label for="ema1-period">EMA 1期間</label>
                    <input type="number" id="ema1-period" value="10">
                </div>
                <div class="input-group">
                    <label for="ema2-period">EMA 2期間</label>
                    <input type="number" id="ema2-period" value="25">
                </div>
                <div class="input-group">
                    <label for="ema3-period">EMA 3期間</label>
                    <input type="number" id="ema3-period" value="50">
                </div>
                <button id="apply-indicators-button">反映</button>
            </div>
            <button id="toggle-settings-button">期間設定</button>
            <button id="toggle-bb-button">BB表示/非表示</button>
            <button id="toggle-ema-button">EMA表示/非表示</button>
            
            <div id="subscribe-settings" class="hidden">
                <div class="input-group">
                    <label for="email-input">メールアドレス</label>
                    <input type="email" id="email-input" placeholder="user@example.com">
                </div>
                <button id="subscribe-button">登録</button>
            </div>
            <button id="toggle-subscribe-button">通知宛てメールの登録</button>
        </div>
    </div>
    
    <script src="dist/bundle.js"></script>
</body>
</html>
